name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Build and Test on 3 platforms (Ubuntu, macOS, Windows)
  build_wheels:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Using 2026 standard runners (Removing Intel macos-15)
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-path: "pyproject.toml"

      - name: Build and Test Wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: .
          output-dir: wheelhouse
          # NEW in v3.3: Native uv integration
          extras: "uv"
        env:
          # Massive speed gains using uv as the build frontend
          CIBW_BUILD_FRONTEND: "build[uv]"
          # Skip 32-bit Windows
          CIBW_SKIP: "*-win32 *-musllinux_*"
          # Test configuration using uv
          CIBW_TEST_REQUIRES: "pytest pytest-cov pandas numpy"
          CIBW_TEST_COMMAND: "pytest {project}/tests --ignore={project}/tests/test_benchmark.py"
          # Support latest Python versions in 2026
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"

      - name: Upload Wheels as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # 2. Build Source Distribution (SDist)
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist
        run: uv build --sdist

      - name: Upload SDist as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # 3. Publish to PyPI
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
